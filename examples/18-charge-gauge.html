<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Charge gauge - integrate でチャージを積分</title>
  <style>
    body {
      font-family: sans-serif;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(160deg, #0b132b 0%, #1c2541 55%, #3a506b 100%);
      color: #f1faee;
    }
    .panel {
      width: min(560px, calc(100vw - 40px));
      padding: 28px;
      border-radius: 24px;
      background: rgba(7, 16, 32, 0.78);
      backdrop-filter: blur(12px);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin-top: 0;
      font-size: 32px;
    }
    p {
      line-height: 1.7;
      color: #dbe4ee;
    }
    .meter {
      margin-top: 24px;
      padding: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #bar {
      width: 0%;
      height: 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, #80ed99, #ffd166 70%, #ef476f);
      box-shadow: 0 0 30px rgba(239, 71, 111, 0.35);
      transition: box-shadow 120ms linear;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-family: monospace;
      font-size: 14px;
      color: #cdd7e1;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Charge gauge</h1>
    <p>
      スペースキーを押すとチャージ、離すと自然減少します。<code>integrate</code> が「1 秒あたりの増減量」を時間で積分し、<code>map</code> と <code>setStyle</code> がバー幅へ変換します。
    </p>

    <div class="meter">
      <div id="bar"></div>
    </div>

    <div class="meta">
      <span id="status">status: idle</span>
      <span id="readout">0%</span>
    </div>
  </div>

  <script type="module">
    import { Loom } from "../src/loom.js";

    const graph = {
      nodes: [
        { id: "rate", type: "constant", params: { value: -0.5 } },
        { id: "gauge", type: "integrate", params: { initial: 0, min: 0, max: 1 } },
        { id: "percent", type: "map", params: { inMin: 0, inMax: 1, outMin: 0, outMax: 100, clamp: true } },
        { id: "fill", type: "setStyle", params: { target: "#bar", property: "width", unit: "%" } }
      ],
      edges: [
        { from: "rate.out", to: "gauge.value" },
        { from: "gauge.out", to: "percent.value" },
        { from: "percent.out", to: "fill.value" }
      ]
    };

    const engine = new Loom(graph);
    engine.start();

    const rateNode = graph.nodes.find(node => node.id === "rate");
    const readout = document.getElementById("readout");
    const status = document.getElementById("status");
    const bar = document.getElementById("bar");

    function setCharging(charging) {
      rateNode.params.value = charging ? 1.0 : -0.5;
      status.textContent = charging ? "status: charging" : "status: idle";
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === " ") {
        event.preventDefault();
        setCharging(true);
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === " ") {
        event.preventDefault();
        setCharging(false);
      }
    });

    function draw() {
      const percent = engine.getValue("percent.out") ?? 0;
      readout.textContent = `${Math.round(percent)}%`;
      bar.style.boxShadow = `0 0 ${20 + percent * 0.3}px rgba(239, 71, 111, 0.35)`;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
