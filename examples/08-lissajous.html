<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lissajous curve - sine と cosine の合成</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
    }
    .description {
      color: #666;
      margin: 20px 0;
      line-height: 1.6;
    }
    canvas {
      border: 2px solid #ccc;
      background: #000;
      border-radius: 4px;
      display: block;
      margin: 30px auto;
      max-width: 100%;
    }
    .info {
      font-family: monospace;
      color: #666;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Lissajous curve - sine と cosine の合成</h1>
  <p class="description">
    2つの異なる周波数の sin/cos を別軸に出して、リサジュー曲線を描く。<code>sine</code> と <code>cosine</code> を異なる周波数で並べ、<code>map</code> で画面座標にリマップしている。
  </p>

  <canvas id="canvas" width="800" height="600"></canvas>

  <div class="info">
    グラフ: clock → (sine@freq0.3, cosine@freq0.5) → map → canvas
  </div>

  <script type="module">
    import { Loom } from "../src/loom.js";

    const graph = {
      nodes: [
        { id: "timer", type: "clock" },
        { id: "sineX", type: "sine", params: { freq: 0.3, amplitude: 1 } },
        { id: "cosineY", type: "cosine", params: { freq: 0.5, amplitude: 1 } },
        { id: "mapX", type: "map", params: { inMin: -1, inMax: 1, outMin: 100, outMax: 700 } },
        { id: "mapY", type: "map", params: { inMin: -1, inMax: 1, outMin: 100, outMax: 500 } }
      ],
      edges: [
        { from: "timer.t", to: "sineX.t" },
        { from: "timer.t", to: "cosineY.t" },
        { from: "sineX.out", to: "mapX.value" },
        { from: "cosineY.out", to: "mapY.value" }
      ]
    };

    const engine = new Loom(graph);
    engine.evaluateAt(0);
    engine.start();

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // 半透明の黒で背景を描く（残像効果）
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";

    function tick() {
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const x = engine.getValue("mapX.out");
      const y = engine.getValue("mapY.out");

      // 現在の点を描く
      ctx.fillStyle = "#00ff00";
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
