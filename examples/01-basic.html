<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loom 基本デモ</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
    }
    .description {
      color: #666;
      margin: 20px 0;
    }
    .row {
      font-size: 24px;
      margin: 16px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .label {
      display: inline-block;
      width: 180px;
      color: #666;
      font-weight: bold;
    }
    .value {
      font-family: monospace;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Loom 基本デモ</h1>
  <p class="description">clock ノードが時刻を出力し、それを sine ノードに渡して正弦波を計算します。毎フレーム値が更新されます。</p>

  <div class="row">
    <span class="label">時刻 t:</span>
    <span class="value" id="t">-</span> 秒
  </div>

  <div class="row">
    <span class="label">sin 出力:</span>
    <span class="value" id="sin">-</span>
  </div>

  <script type="module">
    import { Loom } from "../src/loom.js";

    const graph = {
      nodes: [
        { id: "timer", type: "clock" },
        { id: "wave", type: "sine", params: { freq: 0.5, amplitude: 1.0 } }
      ],
      edges: [
        { from: "timer.t", to: "wave.t" }
      ]
    };

    const engine = new Loom(graph);
    engine.evaluateAt({ time: 0 }, 0);
    engine.start({ getEnv: ({ elapsed }) => ({ time: elapsed }) });

    const tEl = document.getElementById("t");
    const sinEl = document.getElementById("sin");

    function tick() {
      const t = engine.getValue("timer.t");
      const sinValue = engine.getValue("wave.out");
      tEl.textContent = t.toFixed(3);
      sinEl.textContent = sinValue.toFixed(3);
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
