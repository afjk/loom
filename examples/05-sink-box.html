<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loom シンクノードデモ</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 200px;
      border: 2px solid #ccc;
      background: #fafafa;
      margin: 30px 0;
      border-radius: 4px;
      overflow: hidden;
    }
    #box {
      position: absolute;
      top: 75px;
      width: 50px;
      height: 50px;
      background: #4a90e2;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Loom シンクノードデモ</h1>
  <p>setStyle シンクノードで、グラフ定義だけで箱を動かします（JS 側のループ処理なし）。</p>
  <div id="stage"><div id="box"></div></div>

  <script type="module">
    import { Loom } from "../src/loom.js";

    const graph = {
      nodes: [
        { id: "timer", type: "clock" },
        { id: "wave", type: "sine", params: { freq: 0.5, amplitude: 200 } },
        { id: "center", type: "constant", params: { value: 275 } },
        { id: "x", type: "add" },
        { id: "out", type: "setStyle", params: { target: "#box", property: "left", unit: "px" } }
      ],
      edges: [
        { from: "timer.t", to: "wave.t" },
        { from: "wave.out", to: "x.a" },
        { from: "center.out", to: "x.b" },
        { from: "x.out", to: "out.value" }
      ]
    };

    const engine = new Loom(graph);
    engine.start({ getEnv: ({ elapsed }) => ({ time: elapsed }) });
  </script>
</body>
</html>
