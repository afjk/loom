<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loom Three.js デモ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      font-family: sans-serif;
      background: #000;
      color: #fff;
    }
    #canvas-host {
      width: 100%;
      height: 100%;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      line-height: 1.6;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 20px;
    }
    p {
      font-size: 14px;
      color: #ccc;
      margin: 8px 0;
    }
    code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-host"></div>
  <div id="info">
    <h1>Loom Three.js デモ</h1>
    <p>Loom グラフエンジンで Three.js の立方体を制御します。</p>
    <p><code>clock</code> ノードが時刻を出力し、<code>multiply</code> ノードで倍率を調整して回転値を計算します。</p>
    <p><code>setRotation</code> ノードが立方体の回転を更新します。</p>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { Loom } from "../src/loom.js";
    import { registerThreeNodes } from "../src/loom-three.js";

    // Three.js のセットアップ
    const host = document.getElementById("canvas-host");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(
      60,
      host.clientWidth / host.clientHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(host.clientWidth, host.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    host.appendChild(renderer.domElement);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 5, 5);
    scene.add(directionalLight);

    // 立方体の作成
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const material = new THREE.MeshPhongMaterial({ color: 0x4a90e2 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // Loom のセットアップ
    registerThreeNodes(Loom, { cube });

    const graph = {
      nodes: [
        { id: "timer", type: "clock" },
        { id: "rotX", type: "multiply", params: { b: 1.0 } },
        { id: "rotY", type: "multiply", params: { b: 0.7 } },
        { id: "rotZ", type: "multiply", params: { b: 0.5 } },
        { id: "rotate", type: "setRotation", params: { target: "cube" } }
      ],
      edges: [
        { from: "timer.t", to: "rotX.a" },
        { from: "timer.t", to: "rotY.a" },
        { from: "timer.t", to: "rotZ.a" },
        { from: "rotX.out", to: "rotate.x" },
        { from: "rotY.out", to: "rotate.y" },
        { from: "rotZ.out", to: "rotate.z" }
      ]
    };

    const engine = new Loom(graph);
    engine.start();

    // レスポンシブ対応
    window.addEventListener("resize", () => {
      const width = host.clientWidth;
      const height = host.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });

    // Three.js のレンダループ
    function animate() {
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
