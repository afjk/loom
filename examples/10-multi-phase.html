<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multi phase wave - 位相ずらしの波</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
    }
    .description {
      color: #666;
      margin: 20px 0;
      line-height: 1.6;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 300px;
      border: 2px solid #ccc;
      background: #fafafa;
      margin: 30px 0;
      border-radius: 4px;
      overflow: hidden;
    }
    .wave-box {
      position: absolute;
      top: 200px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: none;
    }
    .info {
      font-family: monospace;
      color: #666;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Multi phase wave - 位相ずらしの波</h1>
  <p class="description">
    同じ sine ノードを5つ並べ、位相だけ少しずつずらすと、横一列の要素が波打って見える。Max/MSP や TouchDesigner で言うところの『複製してオフセットずらし』をデータフロー的に書いている。
  </p>

  <div id="stage">
    <div class="wave-box" id="box0"></div>
    <div class="wave-box" id="box1"></div>
    <div class="wave-box" id="box2"></div>
    <div class="wave-box" id="box3"></div>
    <div class="wave-box" id="box4"></div>
  </div>

  <div class="info">
    グラフ: clock → sine[0..4] (位相オフセット) → box[0..4].style.top
  </div>

  <script type="module">
    import { Loom } from "../src/loom.js";

    const graph = {
      nodes: [
        { id: "timer", type: "clock" },
        { id: "sine0", type: "sine", params: { freq: 0.5, amplitude: 80, offset: 200, phase: 0 } },
        { id: "sine1", type: "sine", params: { freq: 0.5, amplitude: 80, offset: 200, phase: 0.4 } },
        { id: "sine2", type: "sine", params: { freq: 0.5, amplitude: 80, offset: 200, phase: 0.8 } },
        { id: "sine3", type: "sine", params: { freq: 0.5, amplitude: 80, offset: 200, phase: 1.2 } },
        { id: "sine4", type: "sine", params: { freq: 0.5, amplitude: 80, offset: 200, phase: 1.6 } }
      ],
      edges: [
        { from: "timer.t", to: "sine0.t" },
        { from: "timer.t", to: "sine1.t" },
        { from: "timer.t", to: "sine2.t" },
        { from: "timer.t", to: "sine3.t" },
        { from: "timer.t", to: "sine4.t" }
      ]
    };

    const engine = new Loom(graph);
    engine.evaluateAt(0);
    engine.start();

    const boxes = [
      document.getElementById("box0"),
      document.getElementById("box1"),
      document.getElementById("box2"),
      document.getElementById("box3"),
      document.getElementById("box4")
    ];

    const sineIds = ["sine0", "sine1", "sine2", "sine3", "sine4"];

    // 初期配置
    boxes.forEach((box, i) => {
      box.style.left = i * 120 + 50 + "px";
    });

    function tick() {
      boxes.forEach((box, i) => {
        const top = engine.getValue(sineIds[i] + ".out");
        box.style.top = top + "px";
      });
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
