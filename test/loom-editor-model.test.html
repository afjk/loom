<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Loom Editor Model テスト</title>
</head>
<body>
  <h1>Loom Editor Model テスト</h1>
  <div id="results"></div>
  <script type="module">
    import { graphToEditorModel, editorModelToGraph, applyEditorOperation, layoutFallback, preserveEditorModelLayout, doRectsOverlap, makeNodeLayoutRect, findNonOverlappingPosition } from "../src/loom-editor-model.js";

    const results = [];
    function test(name, fn) { results.push({ name, fn }); }
    function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
    function assertEqual(a, b, msg) {
      const av = JSON.stringify(a);
      const bv = JSON.stringify(b);
      if (av !== bv) throw new Error(msg || `expected ${bv}, got ${av}`);
    }
    function assertThrows(fn) {
      let threw = false;
      try { fn(); } catch (_) { threw = true; }
      if (!threw) throw new Error('expected throw');
    }

    function sampleGraph() {
      return {
        nodes: [
          { id: 't', type: 'clock' },
          { id: 'wave', type: 'sine', params: { freq: 0.3 } },
          { id: 'out', type: 'setVar', params: { key: 'v' } }
        ],
        edges: [
          { from: 't.t', to: 'wave.t' },
          { from: 'wave.out', to: 'out.value' }
        ],
        render: { type: 'point', x: 'wave.out', y: 'wave.out' }
      };
    }

    test('1. roundtrip nodes/edges 等価', () => {
      const g = sampleGraph();
      const em = graphToEditorModel(g);
      const out = editorModelToGraph(em, g);
      assertEqual(out.nodes.map(n => n.id), g.nodes.map(n => n.id));
      assertEqual(out.nodes.map(n => n.type), g.nodes.map(n => n.type));
      assertEqual(out.edges, g.edges);
    });

    test('2. position 無しに layoutFallback', () => {
      const em = graphToEditorModel(sampleGraph());
      assertEqual(em.nodesById.t.position, { x: 0, y: 0 });
      assertEqual(em.nodesById.wave.position, { x: 300, y: 0 });
    });

    test('3. meta.position が保持される', () => {
      const g = sampleGraph();
      g.nodes[1].meta = { position: { x: 11, y: 22 } };
      const em = graphToEditorModel(g);
      assertEqual(em.nodesById.wave.position, { x: 11, y: 22 });
    });

    test('4. edge id format deterministic', () => {
      const em = graphToEditorModel(sampleGraph());
      assert(em.edgesById['t.t->wave.t']);
      assert(em.edgesById['wave.out->out.value']);
    });

    test('5. editorModelToGraph は order を反映', () => {
      const em = graphToEditorModel(sampleGraph());
      em.order = ['out', 'wave', 't'];
      const g = editorModelToGraph(em);
      assertEqual(g.nodes.map(n => n.id), ['out', 'wave', 't']);
    });

    test('6. editorModelToGraph は render 継承', () => {
      const g = sampleGraph();
      const em = graphToEditorModel(g);
      const out = editorModelToGraph(em, g);
      assertEqual(out.render, g.render);
    });

    test('7. addNode は order 末尾に追加', () => {
      const em = graphToEditorModel(sampleGraph());
      const next = applyEditorOperation(em, { type: 'addNode', node: { id: 'n1', type: 'add', category: 'transform', params: {}, position: { x: 1, y: 2 } } });
      assert(next.nodesById.n1);
      assertEqual(next.order[next.order.length - 1], 'n1');
    });

    test('8. removeNode で関連 edge も削除', () => {
      const em = graphToEditorModel(sampleGraph());
      const next = applyEditorOperation(em, { type: 'removeNode', id: 'wave' });
      assert(!next.nodesById.wave);
      assertEqual(Object.keys(next.edgesById).length, 0);
    });

    test('9. updateParam は対象のみ更新', () => {
      const em = graphToEditorModel(sampleGraph());
      const next = applyEditorOperation(em, { type: 'updateParam', id: 'wave', key: 'freq', value: 0.9 });
      assertEqual(next.nodesById.wave.params.freq, 0.9);
      assertEqual(next.nodesById.out.params.key, 'v');
    });

    test('10. moveNode は position のみ更新', () => {
      const em = graphToEditorModel(sampleGraph());
      const next = applyEditorOperation(em, { type: 'moveNode', id: 'wave', position: { x: 99, y: 88 } });
      assertEqual(next.nodesById.wave.position, { x: 99, y: 88 });
      assertEqual(next.nodesById.wave.params, em.nodesById.wave.params);
    });

    test('11. addEdge/removeEdge と冪等', () => {
      let em = graphToEditorModel(sampleGraph());
      em = applyEditorOperation(em, { type: 'addNode', node: { id: 'b', type: 'add', category: 'transform', params: {}, position: { x: 5, y: 5 } } });
      const edge = { id: 't.t->b.a', fromNodeId: 't', fromPort: 't', toNodeId: 'b', toPort: 'a' };
      let next = applyEditorOperation(em, { type: 'addEdge', edge });
      assert(next.edgesById[edge.id]);
      next = applyEditorOperation(next, { type: 'removeEdge', edgeId: edge.id });
      assert(!next.edgesById[edge.id]);
      const idempotent = applyEditorOperation(next, { type: 'removeEdge', edgeId: edge.id });
      assertEqual(idempotent, next);
    });

    test('12. 不正 id は throw', () => {
      const em = graphToEditorModel(sampleGraph());
      assertThrows(() => applyEditorOperation(em, { type: 'updateParam', id: 'none', key: 'a', value: 1 }));
      assertThrows(() => applyEditorOperation(em, { type: 'moveNode', id: 'none', position: { x: 0, y: 0 } }));
      assertThrows(() => applyEditorOperation(em, { type: 'addEdge', edge: { id: 'a.out->none.in', fromNodeId: 'a', fromPort: 'out', toNodeId: 'none', toPort: 'in' } }));
    });


    test('12b. addEdge は不正 id を normalized id で保存', () => {
      let em = graphToEditorModel(sampleGraph());
      em = applyEditorOperation(em, { type: 'addNode', node: { id: 'extra', type: 'add', category: 'transform', params: {}, position: { x: 10, y: 10 } } });
      const edge = { id: 'wrong', fromNodeId: 't', fromPort: 't', toNodeId: 'extra', toPort: 'a' };
      const next = applyEditorOperation(em, { type: 'addEdge', edge });
      assert(next.edgesById['t.t->extra.a']);
      assert(!next.edgesById.wrong);
    });

    test('12c. editorModelToGraph は normalized edge から from/to を生成', () => {
      const em = graphToEditorModel({ nodes: [{ id: 't', type: 'clock' }, { id: 'wave', type: 'sine' }], edges: [] });
      const next = applyEditorOperation(em, {
        type: 'addEdge',
        edge: { id: 'wrong', fromNodeId: 't', fromPort: 't', toNodeId: 'wave', toPort: 't' }
      });
      const g = editorModelToGraph(next);
      assertEqual(g.edges, [{ from: 't.t', to: 'wave.t' }]);
    });

    test('13. layoutFallback column + deterministic', () => {
      const nodes = [
        { id: 'a', category: 'input', position: null },
        { id: 'b', category: 'input', position: null },
        { id: 'c', category: 'state', position: null },
        { id: 'd', category: 'other', position: null }
      ];
      const one = layoutFallback(nodes);
      const two = layoutFallback(nodes);
      assertEqual(one, two);
      assertEqual(one[0].position, { x: 0, y: 0 });
      assertEqual(one[1].position, { x: 0, y: 120 });
      assertEqual(one[2].position, { x: 600, y: 0 });
      assertEqual(one[3].position, { x: 1200, y: 0 });
    });

    test('14. applyEditorOperation immutable', () => {
      const em = graphToEditorModel(sampleGraph());
      const before = JSON.stringify(em);
      const next = applyEditorOperation(em, { type: 'moveNode', id: 'wave', position: { x: 1, y: 1 } });
      assert(JSON.stringify(em) === before, 'input unchanged');
      assert(next !== em, 'new object');
    });

    test('15. preserveEditorModelLayout preserves positions for existing nodes', () => {
      const previous = {
        nodesById: {
          wave: {
            id: 'wave',
            type: 'sine',
            category: 'transform',
            params: { freq: 0.35 },
            position: { x: 123, y: 456 }
          }
        },
        edgesById: {},
        order: ['wave']
      };

      const next = {
        nodesById: {
          wave: {
            id: 'wave',
            type: 'sine',
            category: 'transform',
            params: { freq: 0.8 },
            position: { x: 300, y: 0 }
          }
        },
        edgesById: {},
        order: ['wave']
      };

      const merged = preserveEditorModelLayout(next, previous);

      assert(merged.nodesById.wave.position.x === 123, 'x should be preserved');
      assert(merged.nodesById.wave.position.y === 456, 'y should be preserved');
      assert(merged.nodesById.wave.params.freq === 0.8, 'params should come from next model');
    });

    test('16. preserveEditorModelLayout keeps next position for new nodes', () => {
      const previous = {
        nodesById: {},
        edgesById: {},
        order: []
      };

      const next = {
        nodesById: {
          wave: {
            id: 'wave',
            type: 'sine',
            category: 'transform',
            params: {},
            position: { x: 300, y: 0 }
          }
        },
        edgesById: {},
        order: ['wave']
      };

      const merged = preserveEditorModelLayout(next, previous);

      assert(merged.nodesById.wave.position.x === 300, 'new node should keep next x');
      assert(merged.nodesById.wave.position.y === 0, 'new node should keep next y');
    });

    test('17. preserveEditorModelLayout does not re-add removed nodes', () => {
      const previous = {
        nodesById: {
          old: {
            id: 'old',
            type: 'sine',
            category: 'transform',
            params: {},
            position: { x: 1, y: 2 }
          }
        },
        edgesById: {},
        order: ['old']
      };

      const next = {
        nodesById: {},
        edgesById: {},
        order: []
      };

      const merged = preserveEditorModelLayout(next, previous);

      assert(!merged.nodesById.old, 'removed node should not be restored');
    });

    test('18. doRectsOverlap detects overlapping rectangles', () => {
      const rect1 = { x: 0, y: 0, width: 100, height: 100 };
      const rect2 = { x: 50, y: 50, width: 100, height: 100 };
      const rect3 = { x: 200, y: 200, width: 100, height: 100 };

      assert(doRectsOverlap(rect1, rect2), 'overlapping rects should overlap');
      assert(!doRectsOverlap(rect1, rect3), 'non-overlapping rects should not overlap');
    });

    test('19. makeNodeLayoutRect creates rect with gap', () => {
      const pos = { x: 10, y: 20 };
      const rect = makeNodeLayoutRect(pos);

      assertEqual(rect.x, 10);
      assertEqual(rect.y, 20);
      assert(rect.width > 0, 'width should be positive');
      assert(rect.height > 0, 'height should be positive');
    });

    test('20. findNonOverlappingPosition avoids occupied positions', () => {
      const occupied = [{ x: 0, y: 0 }];
      const result = findNonOverlappingPosition({ x: 0, y: 0 }, occupied);

      assert(result.x !== 0 || result.y !== 0, 'should move away from occupied position');
    });

    test('21. findNonOverlappingPosition returns desired when no overlap', () => {
      const occupied = [{ x: 1000, y: 1000 }];
      const desired = { x: 0, y: 0 };
      const result = findNonOverlappingPosition(desired, occupied);

      assertEqual(result, desired);
    });

    test('22. layoutFallback avoids overlaps for multiple unpositioned nodes', () => {
      const nodes = [
        { id: 'a', category: 'input', position: { x: 0, y: 0 } },
        { id: 'b', category: 'input', position: null },
        { id: 'c', category: 'input', position: null },
        { id: 'd', category: 'input', position: null }
      ];

      const laid = layoutFallback(nodes);

      const positions = laid.map(n => n.position);
      for (let i = 0; i < positions.length; i++) {
        for (let j = i + 1; j < positions.length; j++) {
          const rect1 = makeNodeLayoutRect(positions[i]);
          const rect2 = makeNodeLayoutRect(positions[j]);
          assert(!doRectsOverlap(rect1, rect2), `nodes at ${i} and ${j} should not overlap`);
        }
      }
    });

    test('23. layoutFallback preserves explicitly positioned nodes', () => {
      const nodes = [
        { id: 'a', category: 'input', position: { x: 42, y: 99 } },
        { id: 'b', category: 'input', position: null }
      ];

      const laid = layoutFallback(nodes);

      assertEqual(laid[0].position, { x: 42, y: 99 });
    });

    test('24. layoutFallback maintains deterministic output', () => {
      const nodes = [
        { id: 'a', category: 'input', position: null },
        { id: 'b', category: 'transform', position: null },
        { id: 'c', category: 'state', position: null }
      ];

      const laid1 = layoutFallback(nodes);
      const laid2 = layoutFallback(nodes);

      assertEqual(JSON.stringify(laid1), JSON.stringify(laid2));
    });

    test('25. updateNodeMetadata updates label', () => {
      const em = graphToEditorModel(sampleGraph());
      const next = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { label: 'My Wave' } });
      assertEqual(next.nodesById.wave.label, 'My Wave');
      assertEqual(next.nodesById.wave.type, 'sine', 'type should be unchanged');
      assertEqual(next.nodesById.wave.params, em.nodesById.wave.params, 'params should be unchanged');
    });

    test('26. updateNodeMetadata updates comment', () => {
      const em = graphToEditorModel(sampleGraph());
      const next = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { comment: 'Produces sine output' } });
      assertEqual(next.nodesById.wave.comment, 'Produces sine output');
      assertEqual(next.nodesById.wave.type, 'sine', 'type should be unchanged');
    });

    test('27. updateNodeMetadata updates both label and comment', () => {
      const em = graphToEditorModel(sampleGraph());
      const next = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { label: 'My Wave', comment: 'Produces sine output' } });
      assertEqual(next.nodesById.wave.label, 'My Wave');
      assertEqual(next.nodesById.wave.comment, 'Produces sine output');
    });

    test('28. updateNodeMetadata clears label when set to empty', () => {
      let em = graphToEditorModel(sampleGraph());
      em = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { label: 'My Wave' } });
      const next = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { label: '' } });
      assert(!('label' in next.nodesById.wave) || next.nodesById.wave.label === '', 'label should be empty or deleted');
    });

    test('29. updateNodeMetadata clears comment when set to empty', () => {
      let em = graphToEditorModel(sampleGraph());
      em = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { comment: 'My comment' } });
      const next = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { comment: '' } });
      assert(!('comment' in next.nodesById.wave) || next.nodesById.wave.comment === '', 'comment should be empty or deleted');
    });

    test('30. editorModelToGraph does not leak label into execution graph', () => {
      let em = graphToEditorModel(sampleGraph());
      em = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { label: 'My Wave' } });
      const g = editorModelToGraph(em);
      const waveNode = g.nodes.find(n => n.id === 'wave');
      assert(!('label' in waveNode), 'label should not be in execution graph node');
      assert(waveNode.meta.position, 'position should be in meta');
    });

    test('31. editorModelToGraph does not leak comment into execution graph', () => {
      let em = graphToEditorModel(sampleGraph());
      em = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { comment: 'My comment' } });
      const g = editorModelToGraph(em);
      const waveNode = g.nodes.find(n => n.id === 'wave');
      assert(!('comment' in waveNode), 'comment should not be in execution graph node');
    });

    test('32. updateNodeMetadata throws for non-existent node', () => {
      const em = graphToEditorModel(sampleGraph());
      assertThrows(() => applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'nonexistent', patch: { label: 'test' } }));
    });

    test('33. updateNodeMetadata is immutable', () => {
      const em = graphToEditorModel(sampleGraph());
      const before = JSON.stringify(em);
      const next = applyEditorOperation(em, { type: 'updateNodeMetadata', id: 'wave', patch: { label: 'test' } });
      assertEqual(JSON.stringify(em), before, 'input should not be modified');
      assert(next !== em, 'should return new object');
    });

    async function run() {
      let pass = 0; let fail = 0; const failures = [];
      for (const t of results) {
        try { await t.fn(); pass++; }
        catch (e) { fail++; failures.push({ name: t.name, error: e.message }); }
      }
      window.__loomTestResults = { pass, fail, failures };
      document.getElementById('results').textContent = `${pass} passed, ${fail} failed`;
    }
    run();
  </script>
</body>
</html>
