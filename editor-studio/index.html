<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom Editor Studio MVP</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <canvas id="preview-canvas" class="preview-canvas"></canvas>

  <div class="studio-overlay">
    <div class="studio-toolbar">
      <button id="toggle-panels">Hide Editors</button>
      <button id="openFileBtn" class="btn">Open .loom</button>
      <button id="saveFileBtn" class="btn btn-primary">Save .loom</button>
      <button id="saveAsFileBtn" class="btn">Save As</button>
      <span id="file-status" class="file-status">No file</span>
      <button id="runPreviewBtn" class="btn btn-success">Run Preview</button>
      <button id="resetSampleBtn" class="btn">Reset Sample</button>
      <button id="undo-btn" class="btn" title="Undo graph edit (Ctrl/Cmd+Z)" disabled>
        Undo
      </button>
      <button id="redo-btn" class="btn" title="Redo graph edit (Ctrl/Cmd+Shift+Z)" disabled>
        Redo
      </button>
      <button id="applyDslBtn" class="btn btn-primary">Apply DSL → Node</button>
      <button id="generateDslBtn" class="btn btn-primary">Generate DSL ← Node</button>
      <label class="toolbar-toggle">
        <input id="autoApplyDslToggle" type="checkbox" />
        <span>Auto Apply DSL</span>
      </label>
      <label class="toolbar-toggle">
        <input id="autoSyncGraphToDslToggle" type="checkbox" checked />
        <span>Auto Sync DSL</span>
      </label>
      <div class="toolbar-status" aria-label="Editor status">
        <span id="dirty-status" class="status-pill">Saved</span>
        <span id="auto-apply-status-pill" class="status-pill">Auto Apply OFF</span>
        <span id="auto-sync-status-pill" class="status-pill">Auto Sync OFF</span>
      </div>
      <span id="auto-apply-status" class="auto-apply-status">Manual</span>
    </div>

    <div id="editor-panels" class="editor-panels">
      <!-- Left pane: DSL Editor -->
      <div class="panel dsl-pane">
        <div class="pane-header">
          <h2>DSL Editor</h2>
        </div>
        <div id="dsl-editor-host" class="dsl-editor-host"></div>
      </div>

      <!-- Vertical splitter -->
      <div
        id="editor-split-resize-handle"
        class="editor-split-resize-handle"
        title="Drag to resize editor split"
      ></div>

      <!-- Right pane: Node Editor -->
      <div class="panel node-pane">
        <div class="pane-header">
          <h2>Node Editor</h2>
        </div>
        <div id="node-editor" class="node-editor-canvas"></div>
      </div>

      <!-- Bottom area: GraphJSON, Errors, and Inspector -->
      <div id="bottom-panel-resize-handle" class="bottom-panel-resize-handle" title="Drag to resize bottom panel"></div>

      <div class="panel graph-errors-panel" id="bottom-panel">
        <div class="tab-header">
          <div class="tab-buttons">
            <button class="tab-btn active" data-tab="graph">GraphJSON</button>
            <button class="tab-btn" data-tab="errors">Errors</button>
            <button class="tab-btn" data-tab="inspector">Inspector</button>
            <button class="tab-btn" data-tab="nodes">Nodes</button>
            <button class="tab-btn" data-tab="palette">Palette</button>
            <button class="tab-btn" data-tab="output">Output</button>
          </div>
          <button id="bottom-panel-collapse-btn" class="bottom-panel-collapse-btn" title="Collapse bottom panel">Collapse</button>
        </div>
        <div class="tab-content">
          <div id="graph-tab" class="tab-pane active">
            <pre id="graph-json" class="graph-json"></pre>
          </div>
          <div id="errors-tab" class="tab-pane">
            <div id="errors-list" class="errors-list"></div>
          </div>
          <div id="inspector-tab" class="tab-pane">
            <div id="inspector-panel" class="inspector-panel"></div>
          </div>
          <div id="nodes-tab" class="tab-pane">
            <div class="node-list-panel">
              <div class="node-list-toolbar">
                <input
                  id="node-list-search"
                  class="node-list-search"
                  type="text"
                  placeholder="Search nodes..."
                />
                <select id="node-list-category" class="node-list-category">
                  <option value="">All categories</option>
                </select>
              </div>
              <div id="node-list" class="node-list"></div>
            </div>
          </div>
          <div id="palette-tab" class="tab-pane">
            <div class="palette-panel">
              <div class="palette-toolbar">
                <input id="node-palette-search" class="palette-search" type="text" placeholder="Search node types..." />
                <select id="node-palette-category" class="palette-category">
                  <option value="">All categories</option>
                </select>
              </div>
              <div id="node-palette-list" class="node-palette-list"></div>
            </div>
          </div>
          <div id="output-tab" class="tab-pane">
            <div class="output-panel">
              <div class="output-toolbar">
                <button id="clear-output-btn" class="btn">Clear</button>
              </div>
              <pre id="output-log" class="output-log"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
