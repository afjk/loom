<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom Editor Studio MVP</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <canvas id="preview-canvas" class="preview-canvas"></canvas>

  <div class="studio-overlay">
    <div class="studio-toolbar">
      <button id="toggle-panels">Hide Editors</button>
      <button id="openFileBtn" class="btn">Open .loom</button>
      <button id="saveFileBtn" class="btn btn-primary">Save .loom</button>
      <button id="saveAsFileBtn" class="btn">Save As</button>
      <span id="file-status" class="file-status">No file</span>
      <button id="runPreviewBtn" class="btn btn-success">Run Preview</button>
      <button id="resetSampleBtn" class="btn">Reset Sample</button>
      <button id="applyDslBtn" class="btn btn-primary">Apply DSL → Node</button>
      <button id="generateDslBtn" class="btn btn-primary">Generate DSL ← Node</button>
    </div>

    <div id="editor-panels" class="editor-panels">
      <!-- Left pane: DSL Editor -->
      <div class="panel dsl-pane">
        <div class="pane-header">
          <h2>DSL Editor</h2>
        </div>
        <div id="dsl-editor-host" class="dsl-editor-host"></div>
      </div>

      <!-- Right pane: Node Editor -->
      <div class="panel node-pane">
        <div class="pane-header">
          <h2>Node Editor</h2>
        </div>
        <div id="node-editor" class="node-editor-canvas"></div>
      </div>

      <!-- Bottom area: GraphJSON, Errors, and Inspector -->
      <div class="panel graph-errors-panel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="graph">GraphJSON</button>
          <button class="tab-btn" data-tab="errors">Errors</button>
          <button class="tab-btn" data-tab="inspector">Inspector</button>
        </div>
        <div class="tab-content">
          <div id="graph-tab" class="tab-pane active">
            <pre id="graph-json" class="graph-json"></pre>
          </div>
          <div id="errors-tab" class="tab-pane">
            <div id="errors-list" class="errors-list"></div>
          </div>
          <div id="inspector-tab" class="tab-pane">
            <div id="inspector-panel" class="inspector-panel"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
