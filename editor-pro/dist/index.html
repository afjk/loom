<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Loom Pro Editor</title>
  <script type="module" crossorigin src="./assets/index-5ry4T_I9.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Dhv2Zmn-.css">
</head>
<body>
  <canvas id="preview"></canvas>
  <div id="dom-preview-layer" aria-hidden="true">
    <div id="demo-card">
      DOM Transform Sink
      <div id="demo-readout">starting...</div>
    </div>

    <div id="demo-meter">
      <div class="demo-track"><div id="demo-fill"></div></div>
      <div id="demo-lamp">normal</div>
    </div>
  </div>
  <div id="editor-overlay">
    <div id="editor-titlebar">
      <div class="tabs">
        <button class="tab active" data-mode="dsl">DSL</button>
        <button class="tab" data-mode="json">JSON</button>
      </div>
      <select id="presetSelect"></select>
      <span id="status" class="running">running</span>
      <button id="closeBtn">×</button>
    </div>
    <div id="editor-host"></div>
    <div id="values-pane">
      <div id="values-toggle">▼ Current Values</div>
      <div id="values-content"></div>
    </div>
  </div>
  <button id="reopenBtn" style="display: none;">✎</button>
</body>
</html>
