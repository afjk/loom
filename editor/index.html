<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom Live Editor</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1a1a1a;
      color: #fff;
    }

    #header {
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }

    #header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      flex: 0 0 auto;
    }

    #presetSelect {
      padding: 6px 12px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    #presetSelect:hover {
      background: #333;
    }

    #status {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Monaco', 'Courier New', monospace;
      flex: 1;
      text-align: right;
    }

    #status.running {
      background: #1a4d1a;
      color: #4ade80;
    }

    #status.error {
      background: #4d1a1a;
      color: #ff6b6b;
    }

    #container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      overflow: hidden;
    }

    .pane:last-child {
      border-right: none;
    }

    .pane-label {
      padding: 8px 12px;
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    #editorPane {
      flex: 1;
      overflow: hidden;
    }

    #editor {
      width: 100%;
      height: 100%;
      padding: 12px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    #rightPane {
      display: grid;
      grid-template-rows: 300px 1fr;
      gap: 0;
    }

    #canvasContainer {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      padding: 12px;
      overflow: hidden;
    }

    #preview {
      background: #000;
      border-radius: 4px;
      max-width: 100%;
      max-height: 100%;
    }

    #valuesPane {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #values {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #aaa;
    }

    .value-line {
      margin: 2px 0;
    }

    .value-name {
      color: #66b3ff;
    }

    .value-equals {
      color: #888;
    }

    .value-result {
      color: #8df88d;
    }

    /* Scrollbar styling */
    #editor::-webkit-scrollbar,
    #values::-webkit-scrollbar {
      width: 8px;
    }

    #editor::-webkit-scrollbar-track,
    #values::-webkit-scrollbar-track {
      background: #2a2a2a;
    }

    #editor::-webkit-scrollbar-thumb,
    #values::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    #editor::-webkit-scrollbar-thumb:hover,
    #values::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      #container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .pane {
        border-right: none;
        border-bottom: 1px solid #333;
      }

      .pane:last-child {
        border-bottom: none;
      }

      #rightPane {
        grid-template-rows: 1fr;
      }

      #canvasContainer {
        border-bottom: 1px solid #333;
      }
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Loom Live Editor</h1>
    <select id="presetSelect"></select>
    <div id="status" class="running">running</div>
  </div>

  <div id="container">
    <div class="pane" id="editorPane">
      <div class="pane-label">JSON Graph</div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <div class="pane" id="rightPane">
      <div>
        <div class="pane-label">Preview</div>
        <div id="canvasContainer">
          <canvas id="preview" width="800" height="500"></canvas>
        </div>
      </div>
      <div id="valuesPane">
        <div class="pane-label">Current Values</div>
        <div id="values"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Loom } from "../src/loom.js";
    import { presets } from "./presets.js";

    // State
    let engine = null;
    let currentRender = null;
    let debounceTimer = null;
    const DEBOUNCE_MS = 250;
    const STORAGE_KEY = "loom-editor-text";

    // UI Elements
    const editor = document.getElementById("editor");
    const presetSelect = document.getElementById("presetSelect");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");
    const valuesEl = document.getElementById("values");

    // Initialize preset dropdown
    function initPresets() {
      presetSelect.innerHTML = "";
      Object.entries(presets).forEach(([key, preset]) => {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = preset.label;
        presetSelect.appendChild(option);
      });
    }

    // Handle preset selection
    presetSelect.addEventListener("change", (e) => {
      const key = e.target.value;
      const preset = presets[key];
      if (preset) {
        editor.value = JSON.stringify(preset.graph, null, 2);
        localStorage.setItem(STORAGE_KEY, editor.value);
        debouncedLoad();
      }
    });

    // Handle Tab key in textarea
    editor.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const value = editor.value;
        editor.value = value.substring(0, start) + "  " + value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
      }
    });

    // Handle editor changes with debounce
    editor.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(debouncedLoad, DEBOUNCE_MS);
    });

    function debouncedLoad() {
      try {
        const graphText = editor.value.trim();
        if (!graphText) {
          setStatus("error", "JSON: Empty graph");
          return;
        }

        const parsed = JSON.parse(graphText);

        // Extract render config if present
        const renderConfig = parsed.render;

        // Create a copy without render field for Loom
        const graphForLoom = { ...parsed };
        delete graphForLoom.render;

        // Load the graph
        if (!engine) {
          engine = new Loom(graphForLoom);
          engine.start();
        } else {
          engine.load(graphForLoom);
        }

        // Update render config
        currentRender = renderConfig || null;

        // Save to localStorage
        localStorage.setItem(STORAGE_KEY, editor.value);
        setStatus("running", "running");
      } catch (e) {
        if (e.name === "SyntaxError") {
          setStatus("error", `JSON: ${e.message}`);
        } else if (e.code) {
          setStatus("error", `${e.code}: ${e.message}`);
        } else {
          setStatus("error", `Error: ${e.message}`);
        }
      }
    }

    function setStatus(type, message) {
      statusEl.className = type;
      statusEl.textContent = message;
    }

    function formatValue(val) {
      if (val === null || val === undefined) {
        return "null";
      }
      if (typeof val === "number") {
        return val.toFixed(3);
      }
      if (typeof val === "object") {
        if (Array.isArray(val)) {
          return "[" + val.map(v => typeof v === "number" ? v.toFixed(3) : v).join(", ") + "]";
        }
        const entries = [];
        for (const key in val) {
          const v = val[key];
          entries.push(`${key}: ${typeof v === "number" ? v.toFixed(3) : v}`);
        }
        return "{" + entries.join(", ") + "}";
      }
      return String(val);
    }

    function resolveValue(ref) {
      // If already a number, return it directly
      if (typeof ref === "number") {
        return ref;
      }

      if (ref === null || ref === undefined) {
        return null;
      }

      if (!engine) return null;

      // Check if it's a numeric literal string
      const numVal = parseFloat(ref);
      if (!isNaN(numVal) && String(ref).trim() === String(numVal)) {
        return numVal;
      }

      return engine.getValue(ref);
    }

    function tick() {
      // Update canvas
      if (engine && canvas && ctx) {
        if (currentRender) {
          // Apply trail effect if specified
          const trail = currentRender.trail !== undefined ? currentRender.trail : 0.1;
          if (trail > 0) {
            ctx.fillStyle = `rgba(0, 0, 0, ${trail})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          // Draw based on render type
          if (currentRender.type === "point") {
            const x = resolveValue(currentRender.x);
            const y = resolveValue(currentRender.y);
            const color = currentRender.color || "#00ff00";

            if (x !== null && y !== null && typeof x === "number" && typeof y === "number") {
              ctx.fillStyle = color;
              ctx.beginPath();
              ctx.arc(x, y, 4, 0, Math.PI * 2);
              ctx.fill();
            } else {
              // Fallback to center
              ctx.fillStyle = color;
              ctx.beginPath();
              ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (currentRender.type === "bar") {
            const width = resolveValue(currentRender.width);
            const color = currentRender.color || "#00ccff";
            const height = currentRender.height !== undefined ? currentRender.height : 40;
            const y = currentRender.y !== undefined ? resolveValue(currentRender.y) : (canvas.height - height) / 2;

            if (width !== null && typeof width === "number" && y !== null && typeof y === "number") {
              ctx.fillStyle = color;
              ctx.fillRect(0, y, width, height);
            }
          }
        } else {
          // Clear canvas with semi-transparent black
          ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      // Update values table
      if (engine && engine._currentGraph) {
        const lines = [];
        for (const node of engine._currentGraph.nodes) {
          const nodeType = engine._currentGraph.nodes.find(n => n.id === node.id);
          if (!nodeType) continue;

          // Get node type to get output ports
          const graph = engine._currentGraph;
          const nodeTypeDef = graph.nodes.find(n => n.id === node.id);
          if (!nodeTypeDef) continue;

          // We need access to NODE_TYPES but it's internal to loom.js
          // Instead, iterate through what values exist
          const keys = Array.from(engine._values.keys());
          for (const key of keys) {
            if (key.startsWith(node.id + ".")) {
              const value = engine.getValue(key);
              const formatted = formatValue(value);
              lines.push(`<span class="value-line"><span class="value-name">${key}</span><span class="value-equals"> = </span><span class="value-result">${formatted}</span></span>`);
            }
          }
        }

        valuesEl.innerHTML = lines.join("");
      }

      requestAnimationFrame(tick);
    }

    // Initialize
    function init() {
      initPresets();

      // Load from localStorage or use default preset
      let savedText = localStorage.getItem(STORAGE_KEY);
      if (!savedText) {
        // Use first preset as default
        const firstKey = Object.keys(presets)[0];
        savedText = JSON.stringify(presets[firstKey].graph, null, 2);
        presetSelect.value = firstKey;
      } else {
        // Try to detect which preset is loaded
        try {
          const parsed = JSON.parse(savedText);
          for (const [key, preset] of Object.entries(presets)) {
            if (JSON.stringify(parsed) === JSON.stringify(preset.graph)) {
              presetSelect.value = key;
              break;
            }
          }
        } catch (e) {
          // Ignore
        }
      }

      editor.value = savedText;

      // Initial load
      debouncedLoad();

      // Start animation loop
      tick();
    }

    init();
  </script>
</body>
</html>
